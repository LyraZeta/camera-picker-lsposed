plugins {
    id "com.android.application"
}

android {
    namespace "com.lyra.camerapicker.probe"
    compileSdk 35

    defaultConfig {
        applicationId "com.lyra.camerapicker.probe"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
