name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify vendored Xposed API
        shell: bash
        run: |
          echo "F48C635F1C7469FDEC0E00AD2EA0B7A6B2F5B55065784A35B7CA3A84615E8E25  app/libs/api-82.jar" | sha256sum --check --strict

      - name: Lint and assemble debug APKs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:lintDebug \
            :probe:lintDebug \
            :app:assembleDebug \
            :probe:assembleDebug

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/CameraPicker-LSPosed-debug.apk
          cp probe/build/outputs/apk/debug/probe-debug.apk dist/CameraIntentProbe-debug.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-picker-debug-apks
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            probe/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
